<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="style.css">
    <title>ATIVIDADE 04</title>
</head>
<body>
    <div class="dados">
        <form>
            <img src="logo/logo plataforma aluno.png" alt="">
            <h1>Criar sua conta</h1>
            <p>Preencha seus dados para começar</p>

            <label for="nome-completo">Nome completo</label>
            <input type="text" placeholder="Seu Nome completo">

            <label for="email">E-mail</label>
            <input type="email" placeholder="Digite seu E-mail">
            <a href="" class="senha">esqueceu a senha?</a>


        

    <div class="data">

        <div class="campo">    
            <label for="data-de-nascimento"> Data de Nascimento</label>
            <input type="date" name="data-de-nascimento" id="data">
        </div>

        <div class="genero">
            <label for="genero">Gênero</label>
            <select name="genero" id="">
                <option value="">selecione</option>
                <option value="masculino"> Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="outro">Outro</option>
                <option value="prefiro-nao-dizer">Prefiro não dizer</option>
            </select>

    
        </div>
    </div>

        <div class="termos">
            <input type="checkbox">
            <span>Li e concordo com os <a href="">termos de uso</a> e <a href="">politica de privacidade</a></span>
        </div>

        <button type="submit">Cadastrar</button>

        <p class="login">Já tem conta?
            <a href="">entrar</a>
        </p>

        </form>

    </div>

</body>
</html>
